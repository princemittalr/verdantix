<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verdantix Maintainer</title>
<meta name="theme-color" content="#0f2a1f">
<link rel="manifest" href="manifest-maintainer.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --forest: #10261b; --lime: #b5f36a; --lime-2: #d6fba8; --green: #2f9e5b; --ink: #111611; --muted: #6b746c; --bg: #e8ece6; --card: #fff;
    --tint: #f2f4f0; --line: #e3e7e1; --crit: #e5484d; --warn: #e8962b; --font: "Geist", "Segoe UI", system-ui, sans-serif;
    --shadow: 0 1px 2px rgba(16,38,27,.05), 0 18px 40px -18px rgba(16,38,27,.28); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 16px/1.45 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(232,236,230,.92); backdrop-filter: blur(10px); padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 10px; max-width: 640px; margin: 0 auto; }
  header::before { content: ""; width: 40px; height: 40px; flex: none; border-radius: 14px; background: var(--forest)
    radial-gradient(circle at 50% 50%, var(--lime) 0 6px, transparent 7px); box-shadow: inset 0 0 0 9px var(--forest), inset 0 0 0 11px rgba(181,243,106,.5); }
  header b { font-size: 17px; letter-spacing: -.02em; } header small { display: block; color: var(--muted); font-size: 12.5px; }
  header button { margin-left: auto; }
  main { padding: 6px 16px calc(40px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  button { font: 700 15.5px var(--font); border-radius: 99px; border: 0; padding: 14px 18px; cursor: pointer; background: var(--tint); color: var(--ink); min-height: 52px; }
  button.primary { background: var(--forest); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 22px; }
  button.primary::after { content: "→"; width: 42px; height: 42px; border-radius: 50%; background: var(--lime); color: var(--forest); display: grid; place-items: center; font-size: 20px; }
  button.lime { background: var(--lime); color: var(--forest); }
  button.ghost { background: #fff; color: var(--ink); padding: 8px 14px; min-height: 0; font-size: 13px; box-shadow: var(--shadow); }
  button:disabled { opacity: .5; }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .card { background: var(--card); border-radius: 30px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  h1 { font: 800 38px/1.02 var(--font); letter-spacing: -.045em; margin: 10px 0 6px; }
  h1 em { font-style: normal; background: var(--lime); padding: 0 10px; border-radius: 14px; }
  h2 { font: 800 21px/1.2 var(--font); letter-spacing: -.02em; margin: 0 0 6px; }
  .muted { color: var(--muted); font-size: 14px; }
  .lead { color: var(--muted); font-size: 14.5px; margin: 0 0 14px; }
  /* job list: mission cards */
  .order { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; cursor: pointer; border: 2px solid transparent; border-radius: 26px; }
  .order.sel { border-color: var(--forest); }
  .order .ic { grid-row: 1 / span 3; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: var(--lime); color: var(--forest); }
  .order .ic.crit { background: #fdeaea; color: var(--crit); }
  .order .go { grid-column: 3; grid-row: 1 / span 3; width: 44px; height: 44px; border-radius: 50%; background: var(--forest); color: var(--lime); display: grid; place-items: center; font-size: 18px; }
  .order .tt { font: 700 16px/1.3 var(--font); letter-spacing: -.01em; }
  .prog { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0 2px; }
  .prog i { height: 6px; border-radius: 3px; background: var(--line); } .prog i.on { background: var(--green); } .prog i.now { background: var(--lime); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill { display: inline-block; padding: 4px 11px; border-radius: 99px; font: 700 12.5px var(--font); background: var(--tint); }
  .pill.late { background: #fdeaea; color: #9b1f1b; } .pill.crit { background: #fdeaea; color: #9b1f1b; } .pill.warn { background: #fdf1df; color: #8a5207; }
  .pill.ok { background: var(--lime); color: var(--forest); }
  select { appearance: none; }
  input, select, textarea { font: 500 16px var(--font); width: 100%; padding: 14px 16px; border-radius: 18px; border: 1.5px solid transparent; background: var(--tint); color: var(--ink); }
  input:focus, select:focus, textarea:focus { border-color: var(--forest); background: #fff; outline: none; }
  #team { background: #fff; box-shadow: var(--shadow); border-radius: 99px; }
  /* job detail: map first, mission sheet below */
  #detail { padding: 0 18px 4px; overflow: hidden; }
  #detail h2 { margin-top: 18px; }
  #map { height: 340px; border-radius: 26px; overflow: hidden; margin: 12px -10px !important; background: #dfe7e0; }
  .dist { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: -66px 2px 10px !important; position: relative; z-index: 2; }
  .dist div { background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-radius: 20px; padding: 10px 14px; box-shadow: var(--shadow); }
  .dist b { display: block; font: 800 24px var(--font); letter-spacing: -.03em; } .dist span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .actions .wide { grid-column: 1 / -1; }
  .actions a { text-decoration: none; }
  .msg { padding: 12px 14px; border-radius: 18px; background: var(--tint); font-size: 14.5px; margin-top: 10px; font-weight: 600; }
  .msg.err { background: #fdeaea; color: #9b1f1b; } .msg.ok { background: var(--lime-2); color: var(--forest); }
  img.ev { width: 100%; border-radius: 22px; margin-top: 12px; }
  .loc { font: 600 14px var(--font); padding: 12px 14px; border-radius: 18px; background: var(--lime-2); color: var(--forest); margin: 10px 0 0; display: flex; gap: 10px; align-items: center; }
  .loc::before { content: ""; width: 12px; height: 12px; flex: none; border-radius: 50%; background: var(--forest); box-shadow: 0 0 0 5px var(--lime); }
  .loc.warn { background: #fdf1df; color: #8a5207; } .loc.warn::before { background: var(--warn); box-shadow: 0 0 0 5px #f7e3c2; }
  .loc.err { background: #fdeaea; color: #9b1f1b; } .loc.err::before { background: var(--crit); box-shadow: 0 0 0 5px #f8cfd0; }
  details { margin: 14px 0 18px !important; } summary { cursor: pointer; font-weight: 700; }
  .tl { font-size: 13.5px; color: var(--ink); padding-left: 18px; margin: 8px 0 0; } .tl li { margin-bottom: 6px; } .tl span { color: var(--muted); }
  .me { width: 18px; height: 18px; border-radius: 50%; background: #2c6bed; border: 3px solid #fff; box-shadow: 0 0 0 7px rgba(44,107,237,.25); }
  #signin h1 { margin-top: 0; }
  #signin button.primary { width: 100%; margin-top: 12px; }
</style>
</head>
<body>
<header><div><b>Verdantix Maintainer</b><small id="who">Assigned work, route and proof</small></div><button class="ghost" id="signout" hidden>Sign out</button></header>
<main>
  <section id="signin" class="card" hidden>
    <h1>Ready for<br>your <em>jobs?</em></h1>
    <p class="lead">For maintenance staff. Use the maintainer passcode from facilities (operators can use theirs).</p>
    <form id="sf"><input id="pass" type="password" autocomplete="current-password" placeholder="Passcode" required aria-label="Passcode">
      <button class="primary">Sign in</button><p id="smsg" class="msg err" hidden></p></form>
  </section>

  <section id="list" hidden>
    <h1>Your <em>jobs</em><br>today</h1>
    <p class="lead" id="jobCount">Loading…</p>
    <div class="row" style="margin-bottom:10px"><select id="team" aria-label="Filter by team"><option value="">All teams</option></select></div>
    <div id="orders"></div>
  </section>

  <section id="detail" class="card" hidden></section>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script>
const API = (window.VX_API || "").replace(/\/$/, "");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const KEY = "vx-staff";
const token = () => { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } };
async function api(path, opt = {}) {
  const r = await fetch(API + path, { ...opt, headers: { ...(opt.headers || {}), "X-Operator": token() } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.detail || r.statusText); e.status = r.status; throw e; }
  return d;
}
const post = (p, body) => api(p, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
const when = (iso) => iso ? new Date(iso).toLocaleString("en-IN", { weekday: "short", hour: "numeric", minute: "2-digit" }) : "";

// ---- geometry: distance and which building a point is in ----
const R = 6371000, rad = (d) => (d * Math.PI) / 180;
function meters(a, b) { const dLat = rad(b[1] - a[1]), dLng = rad(b[0] - a[0]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function inside(pt, ring) { let c = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
  const [xi, yi] = ring[i], [xj, yj] = ring[j];
  if (((yi > pt[1]) !== (yj > pt[1])) && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) c = !c; } return c; }
function whereAmI(pt, acc) {
  const polys = (campus?.features || []).filter((f) => f.geometry.type === "Polygon" && f.properties.type !== "sports");
  const hit = polys.find((f) => inside(pt, f.geometry.coordinates[0]));
  const near = polys.map((f) => ({ f, d: meters(pt, f.properties.center) })).sort((a, b) => a.d - b.d)[0];
  if (hit && acc <= 40) return { cls: "", text: `You're in ${hit.properties.name} (GPS ±${Math.round(acc)} m)` };
  if (hit) return { cls: "warn", text: `Probably in ${hit.properties.name}, but GPS is only ±${Math.round(acc)} m` };
  if (near && near.d < 150) return { cls: "warn", text: `Near ${near.f.properties.name} (${Math.round(near.d)} m from its centre, GPS ±${Math.round(acc)} m)` };
  return { cls: "warn", text: `Not on the mapped campus (GPS ±${Math.round(acc)} m). Pick where you are below.` };
}

// ---- state ----
let S = null, campus = null, sel = null, me = null, manualFrom = null, watch = null, map = null, mk = {};
async function load() {
  try { [S, campus] = await Promise.all([api("/api/state"), campus || api("/api/campus")]); }
  catch (e) { $("#orders").innerHTML = `<div class="msg err">Can't reach the server (${esc(e.message)}). It retries every 15 s.</div>`; return; }
  renderList(); if (sel) renderDetail();
}
function openOrders() {
  return (S?.orders || []).filter((o) => !["done", "cancelled"].includes(o.status) && (!$("#team").value || o.team === $("#team").value))
    .sort((a, b) => (b.overdue - a.overdue) || String(a.deadline).localeCompare(String(b.deadline)));
}
function renderList() {
  const teams = [...new Set((S.orders || []).map((o) => o.team))];
  const cur = $("#team").value;
  $("#team").innerHTML = `<option value="">All teams</option>` + teams.map((t) => `<option ${t === cur ? "selected" : ""}>${esc(t)}</option>`).join("");
  const os = openOrders();
  $("#jobCount").textContent = os.length ? `${os.length} open job${os.length === 1 ? "" : "s"}${os.some((o) => o.overdue) ? " · some overdue" : ""}. Tap one to see the route.` : "Nothing assigned right now.";
  $("#orders").innerHTML = os.length ? os.map((o) => {
    const a = S.alerts.find((x) => x.id === o.alert_id) || {};
    const step = { assigned: 1, reopened: 1, acknowledged: 2, in_progress: 3, awaiting_verification: 4 }[o.status] || 1;
    const icon = { water: "💧", energy: "⚡", waste: "♻️" }[a.kind] || "🛠️";
    return `<div class="card order ${o.id === sel ? "sel" : ""}" data-o="${o.id}" role="button" tabindex="0" aria-label="Open ${esc(o.id)}">
      <span class="ic ${a.severity === "crit" ? "crit" : ""}" aria-hidden="true">${icon}</span>
      <div class="tt">${esc(o.title)}</div>
      <div class="prog" aria-label="Step ${step} of 4">${[1, 2, 3, 4].map((k) => `<i class="${k < step ? "on" : k === step ? "now" : ""}"></i>`).join("")}</div>
      <div class="row"><span class="pill ${a.severity === "crit" ? "crit" : "warn"}">${a.severity === "crit" ? "Critical" : "Attention"}</span>
        ${o.overdue ? '<span class="pill late">Overdue</span>' : ""}<span class="muted">${esc(o.status.replace(/_/g, " "))} · due ${when(o.deadline)}</span></div>
      <span class="go" aria-hidden="true">→</span></div>`;
  }).join("") : `<div class="card"><h2>No open work orders</h2><p class="muted">When facilities assign a problem, it appears here.</p></div>`;
}
$("#orders").addEventListener("click", (e) => { const c = e.target.closest("[data-o]"); if (c) { sel = c.dataset.o; renderList(); renderDetail(true); } });
$("#orders").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.click(); });
$("#team").onchange = renderList;

function target() {
  const o = S.orders.find((x) => x.id === sel); if (!o) return null;
  const a = S.alerts.find((x) => x.id === o.alert_id) || {};
  let pt = Number.isFinite(a.lng) && Number.isFinite(a.lat) ? [a.lng, a.lat] : null;
  if (!pt) {   // no exact spot: fall back to the centre of the building the incident belongs to
    const f = campus.features.find((x) => x.properties.id === String(a.asset || "").split("/")[0]);
    pt = f?.properties.center || f?.geometry.coordinates || null;
  }
  return pt ? { o, a, pt } : null;
}
function renderDetail(scroll) {
  const t = target(); if (!t) { $("#detail").hidden = false; $("#detail").innerHTML = '<div class="msg err">This order has no location on the campus map yet. Ask facilities to add the building.</div>'; return; }
  const { o, a } = t;
  const flow = { assigned: ["acknowledged", "Acknowledge"], reopened: ["acknowledged", "Acknowledge"], acknowledged: ["in_progress", "Start work"] }[o.status];
  const bld = campus.features.find((f) => f.properties.id === (a.asset || "").split("/")[0]);
  $("#detail").hidden = false;
  $("#detail").innerHTML = `
    <h2>${esc(o.title)}</h2>
    <div class="muted">${esc(o.id)} · ${esc(o.team)} · due ${when(o.deadline)} ${o.overdue ? '· <b style="color:var(--crit)">overdue</b>' : ""}</div>
    <p style="margin:8px 0">${esc(a.detail || "")}</p>
    <div id="here" class="loc warn">Location: press "Use my location" to see the route.</div>
    <div id="map" role="img" aria-label="Map with your position and the destination"></div>
    <div class="dist"><div><span>Straight-line distance</span><b id="dm">--</b></div><div><span>Walk, rough estimate</span><b id="dt">--</b></div></div>
    <p class="muted" style="font-size:12.5px;margin:0">Straight line between you and the problem; campus paths aren't mapped yet, so the walk is estimated as 1.3 × the straight line at 1.2 m/s. Use walking directions for the real path.</p>
    <div class="actions">
      <button id="gps">Use my location</button>
      <select id="from" aria-label="Or pick where you are"><option value="">…or pick where you are</option>${campus.features.filter((f) => f.geometry.type === "Polygon").map((f) => `<option value="${f.properties.id}">${esc(f.properties.name)}</option>`).join("")}</select>
      <a class="wide" id="gmaps" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${t.pt[1]},${t.pt[0]}&travelmode=walking"><button style="width:100%">Open walking directions${bld ? " to " + esc(bld.properties.name) : ""}</button></a>
      ${flow ? `<button class="primary wide" data-st="${flow[0]}">${flow[1]}</button>` : ""}
      ${["in_progress", "acknowledged"].includes(o.status) ? `<label class="wide"><button class="lime" style="width:100%" id="proofBtn" type="button">Take after-fix photo</button><input id="proof" type="file" accept="image/*" capture="environment" hidden></label>` : ""}
      ${o.status === "awaiting_verification" ? `<div class="msg wide">After-fix photo sent; the AI check is running.</div>` : ""}
      <textarea id="note" class="wide" rows="2" placeholder="Add a note for facilities (optional)" maxlength="300"></textarea>
      <button class="wide" id="addNote">Save note</button>
    </div>
    <div id="dmsg"></div>
    ${a.evidence?.image ? `<img class="ev" src="${a.evidence.image.startsWith("http") ? a.evidence.image : API + a.evidence.image}" alt="Evidence photo of the problem">` : ""}
    <details style="margin-top:10px"><summary>History (${o.history.length})</summary><ol class="tl">${o.history.slice().reverse().map((h) => `<li><b>${esc(h.event)}</b> <span>${esc(when(h.at))} · ${esc(h.by)}</span>${h.detail ? `<br>${esc(h.detail)}` : ""}</li>`).join("")}</ol></details>`;
  drawMap();
  $("#gps").onclick = startGps;
  $("#from").onchange = (e) => { const f = campus.features.find((x) => x.properties.id === e.target.value); manualFrom = f ? f.properties.center : null; if (f) { $("#here").className = "loc"; $("#here").textContent = `Starting from ${f.properties.name} (picked by you)`; } route(); };
  $("#detail").querySelectorAll("[data-st]").forEach((b) => b.onclick = () => act(() => post(`/api/orders/${o.id}/status`, { status: b.dataset.st }), "Status updated."));
  $("#addNote").onclick = () => { const t = $("#note").value.trim(); if (!t) return; act(() => post(`/api/orders/${o.id}/comment`, { note: t }), "Note saved."); };
  if ($("#proofBtn")) { $("#proofBtn").onclick = () => $("#proof").click(); $("#proof").onchange = (e) => { const f = e.target.files[0]; if (!f) return;
    const fd = new FormData(); fd.append("file", f); act(() => api(`/api/orders/${o.id}/proof`, { method: "POST", body: fd }).then((r) => { if (!r.ok) throw new Error(r.message); return r; }), "Verified. The order is closed."); }; }
  if (scroll) $("#detail").scrollIntoView({ behavior: "smooth" });
}
async function act(fn, okText) {
  $("#dmsg").innerHTML = `<div class="msg">Working…</div>`;
  try { await fn(); $("#dmsg").innerHTML = `<div class="msg ok">${esc(okText)}</div>`; await load(); }
  catch (e) {
    if (e.status === 401) { localStorage.removeItem(KEY); return gate(); }
    $("#dmsg").innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  }
}

// ---- map + route ----
function drawMap() {
  if (map) { map.remove(); map = null; mk = {}; }
  const t = target();
  map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/positron", center: t.pt, zoom: 17, attributionControl: { compact: true } });
  map.on("load", () => {
    map.addSource("bld", { type: "geojson", data: { type: "FeatureCollection", features: campus.features.filter((f) => f.geometry.type === "Polygon") } });
    map.addLayer({ id: "bld", type: "fill", source: "bld", paint: { "fill-color": "#cfe3d5", "fill-outline-color": "#1f9d55" } });
    map.addSource("line", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "line", type: "line", source: "line", paint: { "line-color": "#1f9d55", "line-width": 4, "line-dasharray": [1.5, 1] } });
    route();
  });
  mk.dest = new maplibregl.Marker({ color: "#e5484d" }).setLngLat(t.pt).addTo(map);
}
function route() {
  const t = target(); if (!t || !map) return;
  const from = manualFrom || (me && [me.lng, me.lat]);
  if (!from) return;
  const d = meters(from, t.pt);
  $("#dm").textContent = d >= 1000 ? `${(d / 1000).toFixed(2)} km` : `${Math.round(d)} m`;
  $("#dt").textContent = `~${Math.max(1, Math.round((d * 1.3) / 1.2 / 60))} min`;
  if (!mk.me) { const el = document.createElement("div"); el.className = "me"; mk.me = new maplibregl.Marker({ element: el }).setLngLat(from).addTo(map); }
  else mk.me.setLngLat(from);
  map.getSource("line")?.setData({ type: "Feature", geometry: { type: "LineString", coordinates: [from, t.pt] } });
  map.fitBounds([from, t.pt], { padding: 50, maxZoom: 18, duration: 600 });
}
function startGps() {
  if (!navigator.geolocation) { $("#here").className = "loc err"; $("#here").textContent = "This browser has no location. Pick where you are."; return; }
  $("#here").className = "loc warn"; $("#here").textContent = "Asking for location permission…";
  if (watch != null) navigator.geolocation.clearWatch(watch);
  watch = navigator.geolocation.watchPosition((p) => {
    me = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; manualFrom = null;
    const w = whereAmI([me.lng, me.lat], me.acc); $("#here").className = `loc ${w.cls}`; $("#here").textContent = w.text; route();
  }, (e) => {
    $("#here").className = "loc err";
    $("#here").textContent = e.code === 1 ? "Location permission was blocked. Allow it from the address bar, or pick where you are." : "Couldn't get a location fix. Pick where you are.";
  }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
}
document.addEventListener("visibilitychange", () => { if (document.hidden && watch != null) { navigator.geolocation.clearWatch(watch); watch = null; } });

// ---- sign-in gate: the server decides the role ----
async function gate() {
  let w = { role: "public" };
  if (token()) { try { w = await api("/api/whoami"); } catch {} }
  const ok = w.role === "maintainer" || w.role === "admin";
  $("#signin").hidden = ok; $("#list").hidden = !ok; $("#signout").hidden = !ok; if (!ok) $("#detail").hidden = true;
  $("#who").textContent = ok ? `Signed in as ${w.role === "admin" ? "operator" : "maintainer"}` : "Assigned work, route and proof";
  if (ok) load();
}
$("#sf").onsubmit = async (e) => {
  e.preventDefault();
  try { localStorage.setItem(KEY, $("#pass").value); const r = await post("/api/signin", { passcode: $("#pass").value }); $("#smsg").hidden = true; gate(); }
  catch (err) { localStorage.removeItem(KEY); $("#smsg").hidden = false; $("#smsg").textContent = err.status === 401 ? "Wrong passcode." : err.message; }
};
$("#signout").onclick = () => { localStorage.removeItem(KEY); sel = null; gate(); };
gate();
setInterval(() => { if (!$("#list").hidden) load(); }, 15000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
